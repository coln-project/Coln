[build-system]
requires = ["setuptools>=62.4.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tree-sitter-coln"
description = "A data-oriented proof assistant"
version = "0.0.1"
keywords = ["incremental", "parsing", "tree-sitter", "coln"]
classifiers = [
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Compilers",
  "Topic :: Text Processing :: Linguistic",
  "Typing :: Typed",
]
authors = [{ name = "Benno Lossin", email = "bl603@cam.ac.uk" }]
requires-python = ">=3.10"
license.text = "Apache-2.0 OR MIT"
readme = "README.md"

[project.urls]
Homepage = "https://github.com/coln-project/coln"
Funding = ""

[project.optional-dependencies]
core = ["tree-sitter~=0.24"]

[tool.cibuildwheel]
build = "cp310-*"
build-frontend = "build"
