[package]
edition = "2021"
name = "coln-node-bindings"
version = "0.1.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi-derive = "3"
napi = { version = "3", features = ["napi6"] }
coln-store = { version = "0.1.0", path = "../coln-store", features = ["coln-query"] }

[build-dependencies]
napi-build = "2"

