[package]
name = "tree-sitter-coln"
description = "A data-oriented proof assistant"
version = "0.0.1"
authors = ["Benno Lossin <bl603@cam.ac.uk>"]
license = "Apache-2.0 OR MIT"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "coln"]
categories = ["parser-implementations", "parsing", "text-editors"]
repository = "https://github.com/coln-project/coln"
edition = "2021"
autoexamples = false

build = "bindings/rust/build.rs"
include = [
  "bindings/rust/*",
  "grammar.js",
  "queries/*",
  "src/*",
  "tree-sitter.json",
  "/LICENSE",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.26.8"
