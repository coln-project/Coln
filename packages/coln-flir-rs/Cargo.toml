[package]
name = "coln-flir-rs"
version = "0.1.0"
edition = "2024"
description = "The Rust definitions of the Coln language first order logic intermediate representation."
readme = "README.md"
repository = "https://github.com/coln-project/Coln"
license = "MIT OR Apache-2.0"

exclude = ["/.gitignore"]

[lib]

[dependencies]
ena = "0.14.4"
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
specta.workspace = true
subenum.workspace = true

[dev-dependencies]
# This is a self-referential dev-dependency to have the feature-gated
# test-utils be available in this crate's integration tests, too.
coln-flir-rs = { path = ".", features = ["test-utils"] }

[features]
test-utils = []
