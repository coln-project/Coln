[package]
name = "coln-integrator"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "The snapshot table data interface of the Coln language."
repository = "https://github.com/coln-project/Coln"
readme = "README.md"
exclude = [
    "/.editorconfig",
    "/.gitattributes",
    "/.gitignore",
    "/AGENTS.md",
    "/flake.nix",
    "/justfile",
    "/scripts/",
]

[features]
test = []

[dependencies]
anyhow = { workspace = true }
coln-store = { path = "../coln-store" }
thiserror = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
